<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | Yarol Bello</title>
    
    <!-- Mismos estilos que el index.html -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Mismas fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos específicos para la página de gracias */
        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-primary);
            position: relative;
        }
        
        .thanks-card {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            border: 1px solid var(--accent);
            box-shadow: 0 0 50px rgba(var(--accent-rgb), 0.1);
            animation: fadeInUp 0.6s ease;
            position: relative;
            z-index: 2;
        }
        
        .thanks-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: pulse 2s infinite;
        }
        
        .thanks-icon svg {
            width: 50px;
            height: 50px;
            fill: var(--bg-primary);
        }
        
        .thanks-card h1 {
            font-size: 2.5rem;
            font-family: var(--font-display);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .thanks-card p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .thanks-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            z-index: -1;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn--primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        .btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo (opcional, para mantener consistencia) -->
    <div id="particles-js"></div>
    
    <!-- Cursor personalizado -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="thanks-page">
        <div class="thanks-card">
            <div class="thanks-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <h1>¡Mensaje Enviado!</h1>
            <p>Gracias por contactarme. Tu mensaje ha sido recibido correctamente y te responderé a la brevedad posible.</p>
            <div class="thanks-buttons">
                <a href="index.html" class="btn btn--primary">
                    <span>VOLVER AL INICIO</span>
                </a>
                <a href="index.html#proyectos" class="btn btn--outline">
                    <span>VER PROYECTOS</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts necesarios para el cursor y partículas -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/cursor.js"></script>
    <script src="js/modules/particles.js"></script>
</body>
</html>
