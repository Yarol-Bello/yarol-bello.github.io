<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | Yarol Bello</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gracias-container {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--bg-secondary);
            border-radius: 30px;
            border: 1px solid var(--accent);
            max-width: 500px;
            margin: 2rem;
            box-shadow: 0 0 50px rgba(var(--accent-rgb), 0.1);
        }
        h1 {
            font-size: 2.5rem;
            font-family: var(--font-display);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg-primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--accent);
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <h1>¡Mensaje Enviado!</h1>
        <p>Gracias por contactarme. Tu mensaje ha sido recibido y te responderé a la brevedad posible.</p>
        <a href="index.html" class="btn">Volver al Inicio</a>
    </div>
</body>
</html>
